.big{font-size:20px;color:var(--g)}.empty{color:var(--m);padding:14px;text-align:center}.ban{background:var(--g);color:#000;padding:8px 16px;font-weight:600}
.ok{color:var(--g)}.er{color:var(--r)}

async function verify(code){const m=String(code).trim().match(/^SD1-([\w-]+)\.([\w-]+)$/);if(!m)throw new Error("This code is not in the right format. Copy the whole code.");if(!CFG||!CFG.pub)throw new Error("The hub is not set up yet. Please contact SD Work Associates.");
const k=await crypto.subtle.importKey("jwk",CFG.pub,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);if(!await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},k,u8(m[2]),u8(m[1])))throw new Error("This code is not valid.");
const p=JSON.parse(new TextDecoder().decode(u8(m[1])));if(!p.e||p.e<today())throw new Error("This code ended on "+p.e+". Please ask for a new one.");p.bits=u8(p.b);return p}

function locked(t){const a=A();return `<div class=box><b>🔒 ${esc(t.n)} is not in your plan.</b><p class=m>Ask for a code that includes this tool.</p>${a.wa?`<a class=btn target=_blank rel=noopener href="https://wa.me/${String(a.wa).replace(/\D/g,"")}?text=${encodeURIComponent("Hello, I want a code for: "+t.n)}">Ask on WhatsApp</a>`:""}</div>`}
// ---------- calculators
function calc(t){return `<div class=box>${t.f.map(([k,l,d])=>`<label>${esc(l)}<input data-k="${k}" type=number step=any inputmode=decimal value="${d??""}"></label>`).join("")}</div><div class=box id=res></div>`}
function runCalc(t){const v={};document.querySelectorAll("[data-k]").forEach(i=>v[i.dataset.k]=parseFloat(i.value)||0);$("#res").innerHTML=t.o.map(([l,e])=>{let r;try{r=new Function("v","with(v){return ("+e+")}")(v)}catch(x){r="-"}return `<div class=row><span style=flex:1>${esc(l)}</span><b class=big>${typeof r=="number"?(isFinite(r)?r.toLocaleString(undefined,{maximumFractionDigits:2}):"-"):esc(r)}</b></div>`}).join("")}
// ---------- logs
const rows=t=>LS.get("sdh:d:"+t.id,[]);
function logv(t){const r=rows(t);return `<div class=box><div class=two>${t.c.map(([k,l,y])=>`<label>${esc(l)}<input data-c="${k}" type="${y=="n"?"number":y=="d"?"date":"text"}" ${y=="d"?`value="${today()}"`:""} step=any></label>`).join("")}</div><div class=row style=margin-top:8px><button class=btn id=la>Add</button></div></div><div class=box>`+(r.length?`<div class=w><table><tr>${t.c.map(c=>"<th>"+esc(c[1])+"</th>").join("")}<th></th></tr>${r.map((x,i)=>"<tr>"+t.c.map(c=>"<td>"+esc(x[c[0]])+"</td>").join("")+`<td><button class=x data-ld="${i}">Delete</button></td></tr>`).join("")}</table></div>`+(t.sum?`<p>${t.sum.map(k=>esc(t.c.find(c=>c[0]==k)[1])+": <b>"+r.reduce((a,x)=>a+(+x[k]||0),0).toLocaleString()+"</b>").join(" &nbsp; ")}</p>`:"")+`<div class=row><button class="btn s" id=lx>Download CSV</button><button class="btn s" id=ls>Share</button></div>`:"<div class=empty>Nothing saved yet.</div>")+"</div>"}
const line=(t,x)=>t.c.map(c=>x[c[0]]).join(" | ");
// ---------- special tools
let ci="General",TM=null,SW=null,swT=0,swR=null;
function sp(t){const f={"Checklists":chk,"Reminders and alarms":rem,"Timer and stopwatch":tmr,"WhatsApp message maker":wam,"Gemini AI assistant":gem,"NotebookLM and Gemini launcher":nbl}[t.n];return f()}
function chk(){const L=TPL[ci]||{};const nm=Object.keys(L);const cn=cur.cn&&L[cur.cn]?cur.cn:nm[0],items=L[cn]||[],st=LS.get("sdh:ck:"+ci+":"+cn,{});
return `<div class=box><div class=two><label>Industry<select id=ci>${Object.keys(TPL).map(x=>`<option ${x==ci?"selected":""}>${esc(x)}</option>`).join("")}</select></label><label>Checklist<select id=cn>${nm.map(x=>`<option ${x==cn?"selected":""}>${esc(x)}</option>`).join("")}</select></label></div></div><div class=box>${items.map((x,i)=>`<label style="display:flex;gap:8px;color:var(--t);font-size:15px"><input type=checkbox style=width:auto data-ck="${i}" ${st[i]?"checked":""}>${esc(x)}</label>`).join("")}<div class=row style=margin-top:8px><button class="btn s" id=ckr>Clear ticks</button><button class="btn s" id=cks>Share</button></div></div>`}
const ics=(ti,dt,min)=>{const d=new Date(dt),z=x=>x.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""),e=new Date(+d+36e5),s=ti.replace(/[\r\n,;]/g," ");return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SD Work Hub//EN","BEGIN:VEVENT","UID:"+Date.now()+"@sdworkhub","DTSTAMP:"+z(new Date()),"DTSTART:"+z(d),"DTEND:"+z(e),"SUMMARY:"+s,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+s,"TRIGGER:-PT"+min+"M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n")};
function rem(){const r=LS.get("sdh:rem",[]);return `<div class=box><label>What to remember<input id=rt></label><div class=two><label>Date and time<input id=rd2 type=datetime-local></label><label>Alarm before<select id=rb><option value=0>At the time</option><option value=10 selected>10 minutes before</option><option value=60>1 hour before</option><option value=1440>1 day before</option></select></label></div><div class=row><button class=btn id=ra>Save</button></div><p class=m>Press "Add to phone calendar" to get a real alarm from your own calendar app. "Notify me" works only while this page is open.</p></div><div class=box>${r.length?r.map((x,i)=>`<div class=row><span style=flex:1><b>${esc(x.t)}</b> <span class=m>${esc(x.d.replace("T"," "))}</span></span><button class="btn s" data-ri="${i}">Add to phone calendar</button><a class="btn s" target=_blank rel=noopener href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(x.t)}&dates=${new Date(x.d).toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"")}/${new Date(+new Date(x.d)+36e5).toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"")}">Google Calendar</a><button class="btn s" data-rn="${i}">Notify me</button><button class=x data-rx="${i}">Delete</button></div>`).join(""):"<div class=empty>No reminders yet.</div>"}</div>`}
function tmr(){return `<div class=box><b>Countdown</b><div class=row style=margin-top:8px><input id=tm type=number value=10 style=max-width:110px> minutes<button class=btn id=ts1>Start</button><button class="btn s" id=ts2>Stop</button></div><p class=big id=td>00:00</p></div><div class=box><b>Stopwatch</b><div class=row style=margin-top:8px><button class=btn id=ws1>Start</button><button class="btn s" id=ws2>Stop</button><button class="btn s" id=ws3>Reset</button></div><p class=big id=wd>00:00.0</p></div>`}
const WT={"Payment reminder":["Assalam o Alaikum {n}, a gentle reminder that Rs {a} is due on {d}. Thank you.","Assalam o Alaikum {n}, Rs {a} ki raqam {d} tak baqaya hai. Meherbani farma kar ada kar dein. Shukriya."],"Order ready":["Dear {n}, your order is ready for pickup. Total: Rs {a}.","{n} sahib, aap ka order tayar hai. Total Rs {a}. Shukriya."],"Appointment reminder":["Dear {n}, this is a reminder of your appointment on {d}.","{n} sahib, {d} ko aap ki appointment hai. Barae meherbani waqt par tashreef layen."],"Delivery update":["Dear {n}, your delivery will reach you on {d}.","{n} sahib, aap ka maal {d} ko pohanch jaye ga."]};
function wam(){return `<div class=box><div class=two><label>Customer name<input id=wn></label><label>WhatsApp number (with country code)<input id=wp placeholder=923001234567></label><label>Amount<input id=wa2></label><label>Date<input id=wd2 type=date></label><label>Message<select id=wt>${Object.keys(WT).map(x=>`<option>${x}</option>`).join("")}</select></label><label>Language<select id=wl><option value=0>English</option><option value=1>Roman Urdu</option></select></label></div><label>Message text<textarea id=wx rows=4></textarea></label><div class=row><button class=btn id=wo>Open in WhatsApp</button></div></div>`}
function wmk(){const x=WT[$("#wt").value][+$("#wl").value];$("#wx").value=x.replace("{n}",$("#wn").value||"customer").replace("{a}",$("#wa2").value||"0").replace("{d}",$("#wd2").value||"the agreed date")}
function gem(){const c=LS.get("sdh:gem",{});return `<div class=box><p class=m>This uses your own free Google AI key, stored only on this device. Get one at aistudio.google.com/apikey.</p><div class=two><label>API key<input id=gk type=password value="${esc(c.k||"")}"></label><label>Model<input id=gm value="${esc(c.m||"gemini-2.5-flash")}"></label></div><label>Your question (English, Urdu or Roman Urdu)<textarea id=gq rows=4></textarea></label><div class=row><button class=btn id=gs>Ask Gemini</button></div><div id=go style="white-space:pre-wrap;margin-top:10px"></div></div>`}
async function askGem(){const k=$("#gk").value.trim(),m=$("#gm").value.trim(),q=$("#gq").value.trim();LS.set("sdh:gem",{k,m});if(!k||!q)return $("#go").textContent="Add your key and a question first.";$("#go").textContent="Working...";
try{const r=await fetch("https://generativelanguage.googleapis.com/v1beta/openai/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+k},body:JSON.stringify({model:m,messages:[{role:"system",content:"You help small businesses in Pakistan. Answer in the language of the question, briefly and practically."},{role:"user",content:q}]})});const t=await r.text();if(!r.ok)throw new Error(r.status+" "+t.slice(0,160));$("#go").textContent=JSON.parse(t).choices[0].message.content}catch(e){$("#go").textContent="Could not get an answer. "+e.message}}
const allData=()=>{const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("sdh:")&&k!="sdh:gem"&&k!="sdh:code")o[k]=localStorage.getItem(k)}return o};
function nbl(){return `<div class=box><p>Open Google's tools in a new tab. They have no open connection for this app, so you move information across yourself.</p><div class=row><a class=btn target=_blank rel=noopener href="https://notebooklm.google.com">Open NotebookLM</a><a class="btn s" target=_blank rel=noopener href="https://gemini.google.com">Open Gemini</a><a class="btn s" target=_blank rel=noopener href="https://aistudio.google.com/apikey">Get a free Gemini key</a></div></div><div class=box><b>Use your hub data as a NotebookLM source</b><p class=m>Copy everything you saved here as text, then add it in NotebookLM with "Add source", then "Copied text".</p><button class=btn id=nc>Copy my data as text</button> <span id=nm class=ok></span></div>`}
function dataText(){let s="SD Work Hub data, "+today()+"\n";TOOLS.filter(t=>t.k=="log").forEach(t=>{const r=rows(t);if(r.length)s+="\n## "+t.n+"\n"+r.map(x=>line(t,x)).join("\n")});return s}
// ---------- draw
function draw(){const a=A();document.title=(a.brand||"SD Work")+" Hub";$("#br").textContent=(a.brand||"SD Work Associates")+" Hub";if(a.color)document.documentElement.style.setProperty("--g",a.color);
$("#bn").innerHTML=a.banner?`<div class=ban>${esc(a.banner)}</div>`:"";
if(a.maint){$("#m").innerHTML=`<div class=box><b>${esc(a.maintMsg||"We are updating. Please come back soon.")}</b></div>`;return}
if(!cur){$("#m").innerHTML=home();return}
const t=cur;let h=`<div class=row style=margin-bottom:10px><button class="btn s" id=bh>Back</button><b style=flex:1;font-size:18px>${esc(t.n)}</b></div>`;
h+=!open_(t)?locked(t):t.k=="calc"?calc(t):t.k=="log"?logv(t):sp(t);$("#m").innerHTML=h;if(open_(t)&&t.k=="calc")runCalc(t)}
document.addEventListener("click",async e=>{const T=e.target,a=k=>T.closest("["+k+"]");let el;
if(el=a("data-t")){cur=TOOLS.find(t=>t.id==el.dataset.t);return draw()}
if(T.id=="bh"){cur=null;return draw()}
if(T.id=="rd"){try{const c=$("#cd").value.trim();LIC=await verify(c);LS.set("sdh:code",c);msg="ok:Code accepted for "+LIC.n+". Your tools are unlocked."}catch(x){msg=x.message}return draw()}
if(T.id=="rm"){localStorage.removeItem("sdh:code");LIC=null;msg="";return draw()}
if(T.id=="bk"){return dl("sd-hub-backup-"+today()+".json","application/json",JSON.stringify(allData()))}
if(cur&&cur.k=="log"){if(T.id=="la"){const o={};document.querySelectorAll("[data-c]").forEach(i=>o[i.dataset.c]=i.value);if(!Object.values(o).some(v=>v&&v!=today()))return;const r=rows(cur);r.push(o);LS.set("sdh:d:"+cur.id,r);return draw()}
 if(el=a("data-ld")){const r=rows(cur);r.splice(+el.dataset.ld,1);LS.set("sdh:d:"+cur.id,r);return draw()}
 if(T.id=="lx"){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';return dl(cur.n+".csv","text/csv",[cur.c.map(c=>q(c[1])).join(","),...rows(cur).map(x=>cur.c.map(c=>q(x[c[0]])).join(","))].join("\n"))}
 if(T.id=="ls")return share(cur.n+"\n"+rows(cur).slice(-10).map(x=>line(cur,x)).join("\n"))}
if(cur&&cur.n=="Checklists"){if(T.id=="ckr"){localStorage.removeItem("sdh:ck:"+ci+":"+$("#cn").value);return draw()}if(T.id=="cks"){const it=TPL[ci][$("#cn").value];return share($("#cn").value+"\n"+it.map(x=>"- [ ] "+x).join("\n"))}}
if(cur&&cur.n=="Reminders and alarms"){const r=LS.get("sdh:rem",[]);if(T.id=="ra"){const t=$("#rt").value.trim(),d=$("#rd2").value;if(!t||!d)return alert("Add what to remember and a date and time.");r.push({t,d,b:$("#rb").value});LS.set("sdh:rem",r);return draw()}
 if(el=a("data-ri")){const x=r[+el.dataset.ri];return dl("reminder.ics","text/calendar",ics(x.t,x.d,x.b))}if(el=a("data-rx")){r.splice(+el.dataset.rx,1);LS.set("sdh:rem",r);return draw()}
 if(el=a("data-rn")){const x=r[+el.dataset.rn],ms=new Date(x.d)-Date.now()-x.b*6e4;if(!("Notification" in window))return alert("This browser cannot show notifications.");if(await Notification.requestPermission()!="granted")return;if(ms<0||ms>2e9)return alert("Pick a time that is still ahead and within about 3 weeks.");setTimeout(()=>new Notification(x.t),ms);el.textContent="Will notify"}}
if(cur&&cur.n=="Timer and stopwatch"){const f=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");
 if(T.id=="ts1"){clearInterval(TM);let s=Math.round((+$("#tm").value||1)*60);$("#td").textContent=f(s);TM=setInterval(()=>{s--;$("#td")&&($("#td").textContent=f(s));if(s<=0){clearInterval(TM);try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.start();setTimeout(()=>o.stop(),1500)}catch(x){}if("Notification" in window&&Notification.permission=="granted")new Notification("Time is up")}},1e3);if("Notification" in window)Notification.requestPermission()}
 if(T.id=="ts2")clearInterval(TM);
 if(T.id=="ws1"){clearInterval(SW);const b=Date.now()-swT;SW=setInterval(()=>{swT=Date.now()-b;$("#wd")&&($("#wd").textContent=f(swT/1e3)+"."+Math.floor(swT%1e3/100))},100)}
 if(T.id=="ws2")clearInterval(SW);if(T.id=="ws3"){clearInterval(SW);swT=0;$("#wd").textContent="00:00.0"}}
if(cur&&cur.n=="WhatsApp message maker"&&T.id=="wo"){wmk();const p=$("#wp").value.replace(/\D/g,"");return window.open("https://wa.me/"+p+"?text="+encodeURIComponent($("#wx").value))}
if(cur&&cur.n=="Gemini AI assistant"&&T.id=="gs")return askGem();
if(cur&&cur.n=="NotebookLM and Gemini launcher"&&T.id=="nc"){try{await navigator.clipboard.writeText(dataText());$("#nm").textContent="Copied"}catch(x){$("#nm").textContent="Copying was blocked by the browser"}}});
document.addEventListener("input",e=>{const T=e.target;if(T.id=="sq"){q=T.value;const p=T.selectionStart;draw();const n=$("#sq");n.focus();n.setSelectionRange(p,p)}else if(T.dataset.k!=null&&cur)runCalc(cur)});
document.addEventListener("change",e=>{const T=e.target;if(T.id=="ci"){ci=T.value;cur.cn=null;draw()}else if(T.id=="cn"){cur.cn=T.value;draw()}else if(T.dataset.ck!=null){const k="sdh:ck:"+ci+":"+$("#cn").value,s=LS.get(k,{});s[T.dataset.ck]=T.checked;LS.set(k,s)}else if(["wt","wl","wn","wa2","wd2"].includes(T.id))wmk();
else if(T.id=="rs"&&T.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);Object.entries(d).forEach(([k,v])=>k.startsWith("sdh:")&&localStorage.setItem(k,v));draw();alert("Your data was restored.")}catch(x){alert("This file could not be read.")}};r.readAsText(T.files[0])}});
(async()=>{try{CFG=await(await fetch("config.json",{cache:"no-store"})).json()}catch(e){}
const c=LS.get("sdh:code",null);if(c&&CFG)try{LIC=await verify(c)}catch(e){msg=e.message}draw()})();
</script></body></html>
