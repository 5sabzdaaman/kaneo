const SAMPLES={
"Daily cash book":[["Why a cash book matters","A cash book is a simple diary of money. Every day you write what came in and what went out. Without it, owners guess their profit and lose small amounts without noticing. With it, you can answer three questions in a minute: how much cash do I have, where did it go, and am I earning?"],["The columns you need","Use five columns: date, what it was for, cash in, cash out, and balance. Cash in is sales and money received. Cash out is purchases, wages, rent and bills. The balance is the running total: yesterday's balance, plus cash in, minus cash out."],["Step by step each day","1. Count the opening cash and write it first.\n2. Record every sale as it happens, not at night.\n3. Record every payment with a short reason.\n4. At closing, count the cash and compare it with the book balance.\n5. Write any difference and the reason, if you know it."],["Common mistakes to avoid","Mixing home money and shop money. Skipping small payments like tea and rickshaw fares. Writing from memory days later. Throwing away receipts. Never counting the cash. Fix these with one cash box for the business and a fixed closing time."],["Practice at your workplace","Start a cash book today, on paper or in the Daily cash book tool. Record one full day. Next morning, check that the opening cash equals yesterday's closing cash. Do this for seven days, then look at which expense is the largest."],["Quick check and next steps","Can you say today's cash in, cash out and balance? Do you know your biggest expense this week? Does the counted cash match the book? If yes, you are ready to add credit sales (khata) and a monthly profit check."]],
"4-point fabric inspection":[["Why this matters","Buyers do not accept fabric by looks. They use a score. The 4-point system gives every defect points, so two inspectors reach the same answer. It helps you decide whether a roll passes and tells the mill what to fix."],["How points are given","Defects are scored by size along the fabric. A common scale: up to 3 inches is 1 point, over 3 and up to 6 inches is 2 points, over 6 and up to 9 inches is 3 points, and over 9 inches is 4 points. Holes are often 2 points up to 1 inch and 4 points above. Many buyers cap any single yard at 4 points. Always follow your buyer's own rules."],["Working out the score","Add all the points for the roll. Then work out points per 100 square yards: total points x 3600, divided by (yards inspected x fabric width in inches). Compare the answer with your buyer's limit. Many buyers use 40, but check the buyer's sheet. The 4-point fabric score tool does the maths for you."],["Inspecting the roll","Use even light and an inspection frame at a steady speed. Check the width at the start, middle and end. Mark each defect, record its position, and write down the roll number. Inspect the whole roll, not only a part of it."],["Common mistakes to avoid","Scoring the same defect twice. Guessing sizes instead of measuring. Inspecting too fast. Not recording roll numbers. Passing a roll because the delivery is late. Honest records protect you when a buyer complains."],["Practice at your workplace","Take one roll and score it with a partner, then compare your results. Check the maths with the 4-point fabric score tool. Write down the defect that repeated most and tell the mill about it."]],
"Planning your first 30 days":[["Choose one customer and one offer","Do not start with everything. Pick one type of customer and one product or service. Write one sentence: I help [customer] with [problem] by [offer]. Small and clear is easier to sell."],["Week 1: test the idea","Talk to ten possible customers. Ask what they buy now, what they pay and what annoys them. Do not sell yet. Write down the answers. If nobody has the problem, change the idea before you spend money."],["Week 2: set up","Set your price from your costs: materials, your time, transport and a profit. Set up a phone number, a WhatsApp Business profile and a simple way to receive money. Keep business money separate from home money."],["Week 3: first sales","Offer to your first five to ten customers: friends of friends, nearby shops, local groups. Deliver well, ask for feedback and ask for a referral. Record each sale in a cash book."],["Week 4: review","Count what came in and what went out. Which customers came back? Which cost was higher than expected? Decide to keep, change or stop. Set a target for the next 30 days."],["Mistakes to avoid in month one","Spending on a shop, logo and stock before testing. Selling below cost. Giving too much credit. Not tracking money. Doing everything alone until you are worn out. Keep it small, keep records and keep learning."]]};
