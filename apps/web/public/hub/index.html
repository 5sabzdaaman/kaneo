async function verify(code){const m=String(code).trim().match(/^SD1-([\w-]+)\.([\w-]+)$/);if(!m)throw new Error("This code is not in the right format. Copy the whole code.");if(!CFG||!CFG.pub)throw new Error("The hub is not set up yet. Please contact SD Work Associates.");

const p=JSON.parse(new TextDecoder().decode(u8(m[1])));if(!p.e||p.e<today())throw new Error("This code ended on "+p.e+". Please ask for a new one.");p.bits=u8(p.b);return p}

<div class=box><div class=row><b style=flex:1>Your streak: ${s} day${s==1?"":"s"}</b>${BADGES.filter(b=>s>=b[0]).map(b=>`<span class=ok>🏅 ${b[1]}</span>`).join("")}</div><p class=m>Use any tool or tick your list each day to keep your streak going.</p></div>
${p.dept?`<div class=box><div class=row><b style=flex:1>${esc(p.dept)}: today's list (${done} of ${d.l.length})</b></div>${d.l.map((x,i)=>`<label style="display:flex;gap:8px;color:var(--t);font-size:15px"><input type=checkbox style=width:auto data-dl="${i}" ${dl[i]?"checked":""}>${esc(x)}</label>`).join("")}</div>
<div class=box><b>Tools for your department</b><div class=grid style=margin-top:8px>${d.t.map(n=>{const t=tool(n);return t?`<button class="tl ${open_(t)?"":"lk"}" data-t="${t.id}">${open_(t)?"":"🔒 "}${esc(t.n)}</button>`:""}).join("")}</div></div>`
:`<div class=box><b>Choose your organisation and department</b><p class=m>Then this page shows your daily list and the tools for your work.</p><button class=btn data-tab=me>Choose now</button></div>`}
<div class=box><b>Your team work</b><p class=m>Tasks, boards and team members are in the work app.</p><a class=btn target=_top href="/">Open my tasks</a></div>`}
function me(){const p=prof();return `<div class=box><b>My profile</b><p class=m>Saved on this device only.</p><div class=two><label>Your name<input id=pn value="${esc(p.name||"")}"></label><label>Phone<input id=pp value="${esc(p.phone||"")}"></label><label>Organisation name<input id=po value="${esc(p.org||"")}"></label><label>Role<input id=pr value="${esc(p.role||"")}"></label><label>Type of organisation<select id=pt><option value="">Choose</option>${ORG.map(x=>`<option ${x==p.type?"selected":""}>${esc(x)}</option>`).join("")}</select></label><label>Your department<select id=pd><option value="">Choose</option>${Object.keys(DEPT).map(x=>`<option ${x==p.dept?"selected":""}>${esc(x)}</option>`).join("")}</select></label></div><div class=row style=margin-top:8px><button class=btn id=ps>Save</button></div></div>
<div class=box><b>My data</b><p class=m>Back up everything you saved in these tools, or restore it on a new phone.</p><div class=row><button class="btn s" id=bk2>Back up my data</button><label class="btn s" style="margin:0">Restore<input type=file id=rs accept=".json" hidden></label></div></div>`}
function ideasHtml(){const f=($("#iq")||{}).value||"",gr=($("#ig")||{}).value||"",L=IDEAS.filter(i=>(!gr||i.g==gr)&&(!f||i.n.toLowerCase().includes(f.toLowerCase())));
return `<p class=m>${L.length.toLocaleString()} ideas${L.length>40?" (showing the first 40, type to narrow down)":""}</p>`+L.slice(0,40).map(i=>{const tn=IDEA_TOOL[i.m],t=tn&&tool(tn);return `<div class=row style="border-bottom:1px solid var(--l);padding:6px 0"><span style=flex:1>${esc(i.n)}<br><span class=m>${i.g}${t?" · Ready now in "+esc(t.n):" · Coming soon"}</span></span>${t?`<button class="btn s" data-oi="${t.id}">Open</button>`:`<button class="btn s" data-rq="${esc(i.n)}">I want this</button>`}</div>`}).join("")}
function store(){const a=A(),lk=TOOLS.filter(t=>!open_(t)),pk=(CFG&&CFG.pkgs)||[];
return `<div class=box><b>${LIC?"Your plan is active for "+esc(LIC.n)+" until "+esc(LIC.e):"You are using the free tools"}</b><p class=m>${TOOLS.filter(open_).length} of ${TOOLS.length} tools are open for you. Locked tools show a padlock.</p></div>
${pk.length?`<div class=box><b>Plans</b><div class=grid style=margin-top:8px>${pk.map(p=>`<div class=tl style=cursor:default><b>${esc(p.name)}</b><br><span class=m>${p.n} features${p.price&&p.price!="0"?" · Rs "+esc(p.price)+" per month":p.price=="0"?" · Free":""}</span><br><button class="btn s" style=margin-top:8px data-rq="the ${esc(p.name)} plan">Ask for this plan</button></div>`).join("")}</div></div>`:""}
<div class=box><b>Locked tools (${lk.length})</b><p class=m>Tap one to ask for it.</p>${lk.map(t=>`<div class=row style="border-bottom:1px solid var(--l);padding:6px 0"><span style=flex:1>🔒 ${esc(t.n)} <span class=m>${esc(t.cat)}</span></span><button class="btn s" data-rq="${esc(t.n)}">Ask</button></div>`).join("")||"<p class=m>Everything is open for you.</p>"}</div>
<div class=box><b>How to pay</b><p style="white-space:pre-wrap">${esc(a.pay||"Message us on WhatsApp and we will tell you how to pay.")}</p><p class=m>After you pay, send us the payment screenshot. We will send you a new code to paste in Tools.</p><button class=btn data-wa="Hello, I have paid. Here is my payment proof.">I paid, send proof</button></div>
<div class=box><b>Ideas library: ${IDEAS.length.toLocaleString()} features we can build for you</b><p class=m>Tell us what you want and we will build it for your business.</p><div class=two><label>Search<input id=iq placeholder="Example: attendance for garment factory"></label><label>Group<select id=ig><option value="">All</option><option>Daily work</option><option>Wellbeing and growth</option></select></label></div><div id=ir>${ideasHtml()}</div></div>`}
function dmo(){const i=(+cur.qi||Math.floor(Date.now()/864e5))%QUOTES.length;cur.qi=i;return `<div class=box><p style="font-size:20px">“${esc(QUOTES[i])}”</p><div class=row><button class=btn id=qn>Next</button><button class="btn s" id=qs>Share</button></div></div>`}
function sho(){return `<div class=box><div class=two><label>Who deserves thanks<input id=hn></label><label>For what<input id=hw placeholder="Example: finishing the order early"></label></div><label>Your message<textarea id=hm rows=3></textarea></label><div class=row><button class=btn id=hs>Share on WhatsApp</button></div><p class=m>Short thank-you messages make people proud of their work.</p></div>`}
function draw(){const a=A();document.body.classList.toggle("emb",EMB);document.title=(a.brand||"SD Work")+" Hub";$("#br").textContent=(a.brand||"SD Work Associates")+" Hub";if(a.color)document.documentElement.style.setProperty("--g",a.color);
$("#bn").innerHTML=a.banner?`<div class=ban>${esc(a.banner)}</div>`:"";
if(a.maint){$("#m").innerHTML=`<div class=box><b>${esc(a.maintMsg||"We are updating. Please come back soon.")}</b></div>`;return}
if(!cur){$("#m").innerHTML=tabbar()+({today:today_,tools:home,store,me}[tab]||today_)();return}
const t=cur;let h=`<div class=row style=margin-bottom:10px><button class="btn s" id=bh>Back</button><b style="flex:1;font-size:18px">${esc(t.n)}</b></div>`;
h+=!open_(t)?locked(t):t.k=="calc"?calc(t):t.k=="log"?logv(t):sp(t);$("#m").innerHTML=h;if(open_(t)&&t.k=="calc")runCalc(t)}
document.addEventListener("click",e=>{const T=e.target,a=k=>T.closest("["+k+"]");let el;
if(el=a("data-tab")){tab=el.dataset.tab;cur=null;return draw()}
if(el=a("data-mood")){const mt=tool("Mood check-in"),r=rows(mt);r.push({d:today(),m:el.dataset.mood,n:""});LS.set("sdh:d:"+mt.id,r);mark();return draw()}
if(el=a("data-oi")){cur=TOOLS.find(t=>t.id==el.dataset.oi);return draw()}
if(el=a("data-rq"))return wa("Hello, I would like to get: "+el.dataset.rq);
if(el=a("data-wa"))return wa(el.dataset.wa);
if(T.id=="ps"){LS.set("sdh:prof",{name:$("#pn").value.trim(),phone:$("#pp").value.trim(),org:$("#po").value.trim(),role:$("#pr").value.trim(),type:$("#pt").value,dept:$("#pd").value});tab="today";return draw()}
if(T.id=="qn"){cur.qi=(cur.qi+1)%QUOTES.length;return draw()}
if(T.id=="qs")return share(QUOTES[cur.qi]);
if(T.id=="hs")return share("⭐ Shout-out for "+($("#hn").value||"our teammate")+"!\n"+($("#hw").value?"For: "+$("#hw").value+"\n":"")+$("#hm").value+"\n— shared from SD Work Associates")});
document.addEventListener("input",e=>{if(e.target.id=="iq")$("#ir").innerHTML=ideasHtml()});
document.addEventListener("change",e=>{const T=e.target;if(T.id=="ig")$("#ir").innerHTML=ideasHtml();else if(T.dataset.dl!=null){const p=prof(),k="sdh:dl:"+today()+":"+(p.dept||""),s=LS.get(k,{});s[T.dataset.dl]=T.checked;LS.set(k,s);mark();draw()}});
(async()=>{try{CFG=await(await fetch("config.json",{cache:"no-store"})).json()}catch(e){}
const c=LS.get("sdh:code",null);if(c&&CFG)try{LIC=await verify(c)}catch(e){msg=e.message}draw()})();
</script></body></html>
