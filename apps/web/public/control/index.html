<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>SD Control Centre v1.7</title>
<style>
:root{--bg:#000;--p:#0c110d;--l:#1d2a20;--t:#e8f0ea;--m:#8a998d;--g:#35d05a;--r:#ff6b5e;--w:#e8b04a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--g);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--l);flex-wrap:wrap}
.lg{width:34px;height:34px;border:1.5px solid var(--g);border-radius:50%;color:var(--g);display:grid;place-items:center;font-weight:800;font-size:13px}
header b{flex:1}nav{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--l);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;color:var(--m);border-bottom:2px solid transparent;white-space:nowrap}.tab.on{color:var(--g);border-color:var(--g);font-weight:700}
main{padding:20px;max-width:1100px;margin:auto}
.btn{background:var(--g);color:#000;border:0;border-radius:8px;padding:8px 14px;font-weight:700}.btn.s{background:none;color:var(--t);border:1px solid var(--l)}.x{background:none;border:0;color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.box{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:14px}.box strong{display:block;font-size:26px;color:var(--g)}
table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--l);font-size:14px}th{color:var(--m);font-weight:600}
.w{overflow-x:auto}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.row h2{margin:0;flex:1;font-size:19px}
input,select,textarea{background:var(--bg);border:1px solid var(--l);border-radius:8px;padding:7px 10px;width:100%}label{display:block;font-size:13px;color:var(--m);margin:9px 0 3px}
dialog{background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:14px;padding:18px;width:min(560px,94vw);max-height:90vh}dialog::backdrop{background:#000a}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tag{border:1px solid var(--g);color:var(--g);border-radius:99px;padding:1px 9px;font-size:12px}.tag.w2{border-color:var(--w);color:var(--w)}.tag.r{border-color:var(--r);color:var(--r)}
.fl{columns:2;column-gap:20px}.fl label{display:flex;gap:8px;align-items:flex-start;color:var(--t);margin:3px 0;font-size:14px}.fl input{width:auto;margin-top:4px}.cat{font-weight:700;color:var(--g);margin:12px 0 4px;break-after:avoid}
.m{color:var(--m);font-size:13px}.empty{color:var(--m);padding:16px;text-align:center}.code{word-break:break-all;font-family:ui-monospace,Consolas,monospace;color:var(--g)}
@media(max-width:640px){.fl{columns:1}.two{grid-template-columns:1fr}}
</style></head><body>
<header><div class="lg">SD</div><b>SD Control Centre <span class="m">for the admin only</span></b><span class="m">v1.7</span></header>
<nav id="nav"></nav><main id="main"></main><dialog id="d"></dialog>
<script>
// Feature catalog. Format: Name:tier+flag. tier 0=admin only,1=Package A and up,2=B and up,3=C only. k = Kaneo already has a base.
const CAT={
"Admin control":"Package builder:0w,Per-client feature switches:0w,Client directory:0w,Redeem codes:0w,Payment log:0w,Expiry reminders:0k,Auto-lock expired plans:0,Admin activity log:0k,View as client:0,Admin dashboard:0w",
"Organisation":"Organisation > unit > department tree:2,Role templates:1k,Group head and unit head access:3k,Cross-unit dashboard:3,Send task to another unit:3,One login for many units:3k,Shift and attendance:2,Worker simple mode:1",
"Industry packs":"Template picker at sign-up:1w,Textile pack:1w,Retail and store pack:1w,Salon and barber pack:1w,Restaurant and bakery pack:1w,Construction and plaza pack:2w,Clinic and pharmacy pack:2w,School and academy pack:2w,Workshop and engineering pack:2w,Agriculture and ginning pack:2w",
"Operations":"Inventory with low-stock alerts:2,Suppliers and purchase orders:2,Customers and dues:2,Quotes and invoices:2,Expenses and petty cash:2,Daily sales closing:2,Appointments and booking:2,Maintenance tickets:1k,Checklist engine:1w,Order batch and lot tracking:2,Payroll with EOBI and PESSI tracker:3,Document store with expiry dates:1k",
"AI assistant":"Chat assistant over your data:3,Voice commands (Urdu and Roman Urdu):3,Action commands (send this task to Ali):3k,Photo help for workers:3,Step-by-step instruction cards:3,Training videos from procedures:3,Daily summary for the owner:3,Pending work by person:3,Admin setup AI:0w,AI provider manager:0w",
"Platform":"WhatsApp alerts:3,Urdu with right-to-left layout:2,Offline mode:3,QR codes for machines and shelves:2,White-label per client:3",
"Money":"Daily cash book:2,Udhaar and khata ledger:2,Post-dated cheque tracker:2,Receivables ageing:2,Payables calendar:2,Profit per order or product:3,Tax and NTN reminders:2,Salary advance tracker:2",
"Retail extras":"Barcode scan:2,Expiry date tracking:2,Branch stock transfer:3,Loyalty points:3,Discount vouchers:3,Cashier shift handover:2,Price change to all branches:3,Customer feedback by QR:2",
"Factory extras":"Machine downtime log:2,Target versus actual per shift:2,Scrap and waste tracking:2,Commission job-work tracking:2,Buyer order deadline countdown:2,Sample approval rounds:2,Gate pass in and out:2,Piece-rate labour records:2",
"Construction extras":"Site progress photos:1,Material request approvals:2,Contractor payment milestones:2,Tenant rent reminders:2,Plaza maintenance tickets:1,Snag and defect list:2",
"Services extras":"Salon staff schedule:2,Membership and session packages:2,Staff commission:2,Clinic patient queue:2,School attendance and fees:2,Tailor orders and measurements:2,Workshop job cards:2",
"AI extras":"Explain reports in simple Urdu:3,Photo of bill to entry:3,Voice note to task:3,Delay-risk alerts:3,Morning plan:3,SOP writer:3,AI budget per client:0",
"Platform extras":"Push notifications:2,PIN quick login:1,Shared-phone mode for workers:2,Export all data:1,Nightly backup to Google Drive:0,Help videos:1,Sandbox practice mode:1,Referral codes:0,Reseller accounts:0,Trial codes:0,Changelog popup:1",
"More ideas (v1.5)":"Supplier price comparison:2,Loss and theft log:2,Complaint tracking:2,Delivery rider tracking:3,Product used per service:2,Customer history with photos:2,Raw material to finished goods:2,Packing lists:2,Vehicle and transport log:2,Utility bill tracking:2,Shared utility bill splitting:3,Drawing version control:3,Lab report tracking:2,Printing press job tracking:2,Mandi trade ledger:2,Event hall bookings:2,Gym memberships:2,Meeting notes to tasks:3,Read instructions aloud in Urdu:3,Client health score:0","Hub tools (v1.6)":"Profit margin calculator:1w,Discount calculator:1w,Sales tax calculator:1w,Percentage change:1w,Bill splitter:1w,Loan instalment (EMI):2w,Break-even point:2w,Commission calculator:2w,Overtime pay:2w,Daily wage to monthly:1w,Piece-rate wage:2w,Fabric consumption:2w,GSM calculator:2w,Yarn count (Ne to tex):2w,4-point fabric score:2w,Defects per hundred pieces:2w,Machine efficiency:2w,Reorder point:2w,Yards and metres:1w,Kilograms and pounds:1w,Maund and kilograms:1w,Inches and centimetres:1w,Square feet and square metres:1w,Tola and grams:1w,Daily cash book:1w,Khata and udhaar ledger:1w,Expense tracker:1w,Cheque tracker:2w,Salary advance tracker:2w,Utility bills:2w,Stock list:1w,Order tracker:2w,Price comparison:2w,Material requests:2w,Loss and theft log:2w,Delivery tracker:2w,Attendance register:2w,Appointments:1w,Customer list:1w,Supplier list:1w,Membership list:2w,Complaint log:2w,Defect log:2w,Lab and sample tracker:2w,Snag list:2w,Job cards:2w,Machine downtime log:2w,Vehicle and transport log:2w,Gate pass log:2w,Checklists:1w,Timer and stopwatch:1w,Reminders and alarms:2w,WhatsApp message maker:2w,Gemini AI assistant:3w,NotebookLM and Gemini launcher:3w,Mood check-in:1w,Goal journal:1w,Daily motivation:1w,Shout-out card maker:1w"};
const F=[];Object.entries(CAT).forEach(([c,s])=>s.split(/,(?=[^,]*:\d)/).forEach(x=>{const m=x.match(/^(.*):(\d)([kw]?)$/);F.push({n:m[1].trim(),c,t:+m[2],k:m[3]=='k',w:m[3]=='w'})}));
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10);
const pk=(lv)=>F.map((f,i)=>f.t>0&&f.t<=lv?i:-1).filter(i=>i>=0);
const byN=l=>l.map(n=>F.findIndex(f=>f.n==n)).filter(i=>i>=0);
const DEF={v:7,tpl:{},ai:{},keys:null,sc:[],atm:{brand:'SD Work Associates',color:'#35d05a',welcome:'Welcome. Free tools are open to everyone. Enter a code to unlock more.',banner:'',maint:false,maintMsg:'We are updating. Please come back soon.',wa:'',pay:''},pkgs:[{id:"S",name:"Starter (free)",price:"0",users:5,feat:byN(["Role templates","Worker simple mode","Template picker at sign-up","Checklist engine","Export all data","Help videos","Sandbox practice mode","Profit margin calculator","Discount calculator","Percentage change","Yards and metres","Kilograms and pounds","Inches and centimetres","Daily cash book","Checklists","Timer and stopwatch","Mood check-in","Daily motivation"])},{id:"A",name:"Shop",price:"",users:10,feat:pk(1)},{id:"B",name:"Business",price:"",users:50,feat:pk(2)},{id:"D",name:"Industry Pro",price:"",users:150,feat:[...pk(2),...byN(["WhatsApp alerts","Offline mode","Chat assistant over your data","Daily summary for the owner","Pending work by person","Payroll with EOBI and PESSI tracker","Profit per order or product","Delay-risk alerts"])]},{id:"C",name:"Group",price:"",users:999,feat:pk(3)}],clients:[],pays:[],codes:[]};
function mig(){if(S.v>=5)return;const ex=new Set(S.pkgs.map(p=>p.id));DEF.pkgs.forEach(p=>{if(!ex.has(p.id))S.pkgs.push(JSON.parse(JSON.stringify(p)))});S.pkgs.forEach(p=>{const lv={A:1,B:2,C:3}[p.id];if(lv)F.forEach((f,i)=>{if(i>=110&&f.t>0&&f.t<=lv&&!p.feat.includes(i))p.feat.push(i)})});S.pkgs.sort((a,b)=>"SABDC".indexOf(a.id)-"SABDC".indexOf(b.id));S.tpl=S.tpl||{};S.ai=S.ai||{};S.v=5}
let S;try{S=JSON.parse(localStorage.getItem("sdcc"))||DEF}catch(e){S=DEF}
mig();mig2();mig3();
const save=()=>{try{localStorage.setItem("sdcc",JSON.stringify({...S,ai:{...(S.ai||{}),key:""}}))}catch(e){}};
let tab="over";const TABS={over:"Overview",cl:"Clients",pk:"Packages",ft:"Feature catalog",tp:"Templates",ai:"AI assistant",pay:"Payments and codes",hub:"Hub and atmosphere",bk:"Backup"};
const P=id=>S.pkgs.find(p=>p.id===id);
const eff=c=>{const b=new Set((P(c.pkg)||{feat:[]}).feat);(c.add||[]).forEach(i=>b.add(i));(c.rem||[]).forEach(i=>b.delete(i));return b};
const cn=id=>(S.clients.find(c=>c.id===id)||{name:"(none)"}).name;
const live=c=>c.expiry&&c.expiry>=today();
function dlg(h,ok,wide){const d=$("#d");d.innerHTML="<form method=dialog>"+h+'<div class="row" style="margin-top:14px"><button class="btn s" value=c>Cancel</button><button class="btn" value=ok>Save</button></div></form>';d.querySelector("form").onsubmit=e=>{if(e.submitter&&e.submitter.value=="ok")ok()};d.showModal()}
const fld=(k,l,v,t)=>`<label for=${k}>${l}</label><input id=${k} type=${t||"text"} value="${esc(v)}">`;
const sel=(k,l,o,v)=>`<label for=${k}>${l}</label><select id=${k}>${o.map(([a,b])=>`<option value="${esc(a)}" ${a==v?"selected":""}>${esc(b)}</option>`).join("")}</select>`;
const g=k=>$("#"+k).value;
function over(){const act=S.clients.filter(live),soon=act.filter(c=>c.expiry<=new Date(Date.now()+14*864e5).toISOString().slice(0,10)),rev=S.pays.filter(p=>p.ok).reduce((a,p)=>a+(+p.amt||0),0);
return `<div class=grid><div class=box><strong>${S.clients.length}</strong>Clients</div><div class=box><strong>${act.length}</strong>Active plans</div><div class=box><strong>${soon.length}</strong>Expiring in 14 days</div><div class=box><strong>${rev.toLocaleString()}</strong>PKR confirmed</div><div class=box><strong>${S.pays.filter(p=>!p.ok).length}</strong>Payments to confirm</div><div class=box><strong>${S.codes.filter(c=>!c.used).length}</strong>Unused codes</div></div>
<div class=box><b>Expiring soon</b>${soon.map(c=>`<p>${esc(c.name)} <span class=m>${esc(c.phone||"")} until ${c.expiry}</span></p>`).join("")||'<p class=m>Nothing expiring in the next 14 days.</p>'}</div>
<div class=box><b>How this works</b><p class=m>This page is your private planning and records desk. It stores everything in this browser only, so use Backup often. It does not yet switch features on inside the live app. Templates, the AI assistant, packages, clients, payments and codes work here. The Feature catalog shows what is ready and what is still planned for the live app.</p></div>`}
function clForm(c){const n=!c;c=c||{id:uid(),name:"",owner:"",phone:"",city:"Faisalabad",industry:"",pkg:"A",expiry:"",ai:"",notes:"",add:[],rem:[]};
dlg(`<h2 style=margin-top:0>${n?"New":"Edit"} client</h2>`+fld("n","Business name",c.name)+`<div class=two>${fld("o","Owner",c.owner)}${fld("ph","Phone",c.phone)}${fld("ci","City",c.city)}${fld("in","Industry",c.industry)}${sel("pg","Package",S.pkgs.map(p=>[p.id,p.id+" "+p.name]),c.pkg)}${fld("ex","Plan ends",c.expiry,"date")}</div>${fld("ai","AI budget (requests per month)",c.ai,"number")}<label for=nt>Notes</label><textarea id=nt rows=2>${esc(c.notes)}</textarea><div class=cat>Features for this client (ticked = on)</div><div class=fl id=ff></div>`,()=>{
if(!g("n").trim())return;const pf=new Set(P(g("pg")).feat),add=[],rem=[];document.querySelectorAll("#ff input").forEach(i=>{const k=+i.dataset.i;if(i.checked&&!pf.has(k))add.push(k);if(!i.checked&&pf.has(k))rem.push(k)});
Object.assign(c,{name:g("n").trim(),owner:g("o"),phone:g("ph"),city:g("ci"),industry:g("in"),pkg:g("pg"),expiry:g("ex"),ai:g("ai"),notes:g("nt"),add,rem});if(n)S.clients.push(c);save();render()});
const e=eff(c);let last="";$("#ff").innerHTML=F.map((f,i)=>{let h=f.c!=last?`<div class=cat>${esc(f.c)}</div>`:"";last=f.c;return h+`<label><input type=checkbox data-i=${i} ${e.has(i)?"checked":""} ${f.t==0?"disabled":""}>${esc(f.n)}</label>`}).join("");
$("#pg").onchange=()=>{const pf=new Set(P(g("pg")).feat);document.querySelectorAll("#ff input").forEach(i=>i.checked=pf.has(+i.dataset.i))}}
function cl(){return `<div class=row><h2>Clients</h2><button class=btn id=ac>Add client</button></div>`+(S.clients.length?`<div class=w><table><tr><th>Business</th><th>Industry</th><th>Package</th><th>Features</th><th>Plan ends</th><th></th></tr>${S.clients.map(c=>`<tr><td><a href=# data-ec=${c.id} style=color:var(--t)>${esc(c.name)}</a><div class=m>${esc(c.owner)} ${esc(c.phone)}</div></td><td>${esc(c.industry)}</td><td>${c.pkg}</td><td>${eff(c).size}</td><td><span class="tag ${live(c)?"":"r"}">${c.expiry||"not set"}</span></td><td><button class=x data-dc=${c.id}>Delete</button></td></tr>`).join("")}</table></div>`:'<div class=empty>No clients yet. Add the first one after you confirm a payment.</div>')}
function pkg(){return `<div class=row><h2>Packages</h2></div><p class=m>Tick what each package includes. Changes affect clients who have no personal override for that feature.</p>`+S.pkgs.map((p,pi)=>`<div class=box><div class=two><div><label>Name</label><input data-pn=${pi} value="${esc(p.name)}"></div><div><label>Price (PKR per month)</label><input data-pp=${pi} type=number value="${esc(p.price)}"></div></div><div class=cat>Package ${p.id} includes ${p.feat.length} features</div><div class=fl>${F.map((f,i)=>f.t==0?"":`<label><input type=checkbox data-pf="${pi}:${i}" ${p.feat.includes(i)?"checked":""}>${esc(f.n)}</label>`).join("")}</div></div>`).join("")}
function ft(){let last="";return `<div class=row><h2>Feature catalog: ${F.length} features</h2></div><p class=m>Ready here = works in this Control Centre now. Base = Kaneo already has a starting point. Planned = not built yet. Admin only = you control it and clients never see it.</p><div class=w><table><tr><th>Feature</th><th>Status</th><th>From package</th></tr>${F.map(f=>{let h=f.c!=last?`<tr><td colspan=3 class=cat>${esc(f.c)}</td></tr>`:"";last=f.c;return h+`<tr><td>${esc(f.n)}</td><td><span class="tag ${f.k||f.w?"":"w2"}">${f.k?"Base":f.w?"Ready here":"Planned"}</span></td><td>${f.t==0?"Admin only":["Shop and up","Business and up","Group"][f.t-1]}</td></tr>`}).join("")}</table></div>`}
function pay(){return `<div class=row><h2>Payments</h2><button class=btn id=ap>Log payment</button></div>`+(S.pays.length?`<div class=w><table><tr><th>Date</th><th>Client</th><th>PKR</th><th>Method</th><th>Reference</th><th>Status</th><th></th></tr>${S.pays.map(p=>`<tr><td>${p.d}</td><td>${esc(cn(p.cl))}</td><td>${esc(p.amt)}</td><td>${esc(p.m)}</td><td>${esc(p.ref)}</td><td><button class="tag ${p.ok?"":"w2"}" data-tp=${p.id}>${p.ok?"Confirmed":"Confirm"}</button></td><td><button class=x data-dp=${p.id}>Delete</button></td></tr>`).join("")}</table></div>`:'<div class=empty>No payments logged.</div>')+`<div class=row style=margin-top:22px><h2>Old-style code records (the hub does not use these)</h2><button class=btn id=ak>Create code</button></div>`+(S.codes.length?`<div class=w><table><tr><th>Code</th><th>Package</th><th>Days</th><th>Status</th><th></th></tr>${S.codes.map(c=>`<tr><td class=code>${c.code}</td><td>${c.pkg}</td><td>${c.days}</td><td><button class=tag data-uc=${c.id}>${c.used?"Used":"Unused"}</button></td><td><button class=x data-dk=${c.id}>Delete</button></td></tr>`).join("")}</table></div>`:'<div class=empty>Create a code after you confirm a payment, then send it on WhatsApp.</div>')}
function bk(){return `<div class=row><h2>Backup</h2></div><div class=box><p>Everything here lives in this browser only. Download a backup file after every change session and keep it in Google Drive. The backup file contains your private signing key, so never send it to anyone.</p><button class=btn id=ex>Download backup</button> <label class="btn s" style="display:inline-block;margin:0">Restore from file<input type=file id=im accept=.json hidden></label></div>`}
const V={over,cl,pk:pkg,ft,pay,bk:bk};
function render(){$("#nav").innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="tab ${k==tab?"on":""}" data-t=${k}>${v}</button>`).join("");$("#main").innerHTML=V[tab]()}
document.addEventListener("click",e=>{const T=e.target,a=k=>T.closest("["+k+"]");let el;
if(el=a("data-t"))tab=el.dataset.t;else if(T.id=="ac")return clForm();else if(el=a("data-ec")){e.preventDefault();return clForm(S.clients.find(c=>c.id==el.dataset.ec))}
else if(el=a("data-dc")){if(confirm("Delete this client?"))S.clients=S.clients.filter(c=>c.id!=el.dataset.dc);else return}
else if(T.id=="ap")return dlg("<h2 style=margin-top:0>Log payment</h2>"+sel("pc","Client",S.clients.map(c=>[c.id,c.name]))+`<div class=two>${fld("pa","Amount (PKR)","","number")}${sel("pm","Method",["JazzCash","EasyPaisa","Bank transfer","Cash"].map(x=>[x,x]))}</div>`+fld("pr","Reference or note",""),()=>{S.pays.unshift({id:uid(),d:today(),cl:g("pc"),amt:g("pa"),m:g("pm"),ref:g("pr"),ok:false});save();render()});
else if(el=a("data-tp")){const p=S.pays.find(x=>x.id==el.dataset.tp);p.ok=!p.ok}else if(el=a("data-dp")){S.pays=S.pays.filter(x=>x.id!=el.dataset.dp)}
else if(T.id=="ak")return dlg("<h2 style=margin-top:0>Create code</h2>"+sel("kp","Package",S.pkgs.map(p=>[p.id,p.id+" "+p.name]))+fld("kd","Days of access","30","number"),()=>{const r=()=>Math.random().toString(36).slice(2,6).toUpperCase();S.codes.unshift({id:uid(),code:`SD-${r()}-${r()}`,pkg:g("kp"),days:g("kd"),used:false});save();render()});
else if(el=a("data-uc")){const c=S.codes.find(x=>x.id==el.dataset.uc);c.used=!c.used}else if(el=a("data-dk")){S.codes=S.codes.filter(x=>x.id!=el.dataset.dk)}
else if(T.id=="ex"){const l=document.createElement("a");l.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S));l.download="sd-control-backup-"+today()+".json";l.click();return}else return;save();render()});
document.addEventListener("change",e=>{const T=e.target;let m;
if(T.dataset.pn!=null)S.pkgs[T.dataset.pn].name=T.value;else if(T.dataset.pp!=null)S.pkgs[T.dataset.pp].price=T.value;
else if(T.dataset.pf){m=T.dataset.pf.split(":");const p=S.pkgs[m[0]],i=+m[1];p.feat=T.checked?[...new Set([...p.feat,i])]:p.feat.filter(x=>x!=i);save();return render()}
else if(T.id=="im"&&T.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.pkgs&&d.clients){S=d;mig();mig2();mig3();save();render()}else alert("This file is not an SD backup.")}catch(x){alert("This file could not be read.")}};r.readAsText(T.files[0]);return}else return;save()});
// ---- v1.5: templates, checklists, AI assistant
const TPL={
"General":{"Weekly team meeting":["Review last week's open tasks","Each person reports done, blocked and next","Agree owners and dates for new tasks","Note decisions","Send the notes to the team"],"New staff onboarding":["Collect documents and contact details","Explain duties and working hours","Show the safety and conduct rules","Give access to the work app","Assign a buddy for the first week","Review after 30 days"]},

"Salon":{"Open the salon":["Clean floors, mirrors and chairs","Sanitise tools","Check towels, capes and products","Check the booking list","Count opening cash"],"Between clients":["Clean and sanitise tools","Change towels and capes","Wipe chair and counter","Record service and payment"],"Close the salon":["Count cash and record payments","Sanitise all tools","List products running low","Switch off equipment and lock up"]},
"Restaurant":{"Kitchen opening":["Check gas, power and water","Clean surfaces","Check fridge and freezer temperature","Check stock for the day","Staff wash hands and wear uniform"],"Food safety daily log":["Record fridge temperatures","Keep raw and cooked food apart","Check dates on ingredients","Check for pests","Record waste"],"Closing":["Clean kitchen and equipment","Store food covered and labelled","Count cash","Take out rubbish","Switch off gas and lock up"]},
"Construction":{"Daily site safety":["Helmets and boots worn","Scaffolding and ladders checked","Cables and electrical points checked","Open edges and holes covered","First aid kit available","Record accidents and near misses"],"Material receiving":["Match delivery to the request","Check quantity and quality","Take photos","Record supplier and vehicle","Store safely","Update stock"],"Handover snag list":["Walk each room or unit","Photograph each defect","Record location and type","Assign to the contractor with a date","Re-check after repair","Sign off"]},
"Clinic":{"Open the clinic":["Clean and ventilate rooms","Check supplies and gloves","Check the appointment list","Check the equipment works"],"Sterilisation log":["Record the instrument set","Clean and wash","Sterilise and note the time","Check the indicator","Store sealed","Sign the log"],"Medicine expiry check":["List medicines by shelf","Remove expired items","Mark near-expiry items","Record what to reorder"]},
"School":{"Daily opening":["Unlock and check classrooms","Check water and washrooms","Check attendance sheets are ready","Check safety exits are clear"],"Exam day":["Prepare seating plan","Count papers and answer sheets","Check invigilators are assigned","Collect and count scripts","Seal and store scripts"]},
"Workshop":{"Job card intake":["Record customer and vehicle or item","Note the complaint in the customer's words","Photograph the item","Agree estimate and delivery date","Customer signs the job card"],"Before delivery":["Check every job-card item is done","Test the work","Clean the item","Record parts used","Take payment and update the card"],"Daily tool check":["Count shared tools","Check power tools and cables","Check safety guards","Report damaged tools"]},
"Agriculture":{"Cotton lot receiving":["Record seller, vehicle and weight","Check moisture and trash","Grade the lot","Record the rate and amount","Issue the receipt","Store the lot and label it"],"Warehouse daily check":["Check roof and floor for damp","Check stacks are safe","Check for pests","Check fire equipment","Update stock count"]}};
const aiCfg=()=>S.ai||(S.ai={});
const PRE={gemini:["https://generativelanguage.googleapis.com/v1beta/openai","gemini-2.5-flash"],groq:["https://api.groq.com/openai/v1","openai/gpt-oss-120b"],openrouter:["https://openrouter.ai/api/v1","google/gemma-4-31b-it:free"],custom:["",""]};
let tplInd="Textile",aiOut={};
const allTpl=i=>({...(TPL[i]||{}),...((S.tpl||{})[i]||{})});
const indSel=()=>sel("ti","Industry",Object.keys(TPL).map(x=>[x,x]),tplInd);
function tp(){return `<div class=row><h2>Industry templates and checklists</h2></div><div class=box>${indSel()}<p class=m>Press Copy, then paste into a Kaneo task description. Kaneo turns these lines into tick boxes.</p></div>`+Object.entries(allTpl(tplInd)).map(([n,it])=>`<div class=box><div class=row><b style=flex:1>${esc(n)}</b><button class="btn s" data-cp="${esc(n)}">Copy as task list</button><button class="btn s" data-pr="${esc(n)}">Print</button></div>${it.map(x=>`<div>☐ ${esc(x)}</div>`).join("")}</div>`).join("")+`<div class=box><b>Add your own checklist for ${esc(tplInd)}</b>${fld("tn","Checklist name","")}<label for=tl>Items, one per line</label><textarea id=tl rows=5></textarea><div class=row style=margin-top:10px><button class=btn id=ts>Save checklist</button></div></div>`}
function ai(){const c=aiCfg(),p=c.p||"gemini";return `<div class=row><h2>AI assistant (admin only)</h2></div><div class=box><b>AI settings</b><p class=m>Use a free key from Google AI Studio, Groq or OpenRouter. The key stays in this browser and is left out of backup files. Free plans have daily limits and different terms, so check them before using AI for paying clients.</p>${sel("cfgP","Provider",[["gemini","Google Gemini"],["groq","Groq"],["openrouter","OpenRouter"],["custom","Other (OpenAI-compatible)"]],p)}<div class=two>${fld("cfgU","Address",c.base??PRE[p][0])}${fld("cfgM","Model name",c.model??PRE[p][1])}</div>${fld("cfgK","API key",c.key||"","password")}</div>
<div class=box><b>1. Describe a client, get the setup</b><label for=sd1>Business</label><textarea id=sd1 rows=3 placeholder="Example: ladies garment unit with 60 workers in stitching, finishing and packing; owner wants WhatsApp alerts"></textarea><div class=row style=margin-top:10px><button class=btn id=ai1>Suggest setup</button></div><div id=so1></div></div>
<div class=box><b>2. Write a checklist</b>${indSel()}<label for=sd2>Checklist for</label><input id=sd2 placeholder="Example: end of shift machine check"><div class=row style=margin-top:10px><button class=btn id=ai2>Write checklist</button></div><div id=so2></div></div>
<div class=box><b>3. Ask for help</b><textarea id=sd3 rows=3 placeholder="Example: how should I price a package for a 10-shop chain?"></textarea><div class=row style=margin-top:10px><button class=btn id=ai3>Ask</button></div><div id=so3></div></div>`}
V.tp=tp;V.ai=ai;
async function callAI(sys,user){const c=aiCfg();if(!c.key||!c.base||!c.model)throw new Error("Add the provider, model and key in AI settings first.");let r;
try{r=await fetch(c.base.replace(/\/$/,"")+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+c.key},body:JSON.stringify({model:c.model,messages:[{role:"system",content:sys},{role:"user",content:user}]})})}catch(x){throw new Error("Could not reach the AI provider. Check your internet, the address and the key.")}
const t=await r.text();if(!r.ok)throw new Error("The provider said: "+r.status+" "+t.slice(0,200));let j;try{j=JSON.parse(t)}catch(x){throw new Error("The provider sent an unreadable reply.")}
const m=j.choices&&j.choices[0]&&j.choices[0].message;if(!m||!m.content)throw new Error("The provider sent an empty reply.");return m.content}
const pj=t=>{try{return JSON.parse(t.match(/\{[\s\S]*\}/)[0])}catch(x){throw new Error("The AI reply could not be read as settings. Press the button again.")}};
const out=(id,h)=>{const e=$("#"+id);if(e)e.innerHTML=h};
const busy=async(id,fn)=>{out(id,"<p class=m>Working...</p>");try{await fn()}catch(x){out(id,'<p style="color:var(--r)">'+esc(x.message)+"</p>")}};
function runSetup(){const d=g("sd1").trim();if(!d)return;return busy("so1",async()=>{const ps=S.pkgs.map(p=>p.id+" = "+p.name+" ("+p.feat.length+" features)").join("; "),fs=F.filter(f=>f.t>0).map(f=>f.n).join("; ");
const t=await callAI('You set up a work-management app for Pakistani businesses. Answer with one JSON object only, no other text: {"name":string,"industry":string,"pkg":one of the package ids,"add":[feature names to add on top of the package],"remove":[feature names to remove],"notes":short string}. Packages: '+ps+". Feature names (use them exactly): "+fs+". Choose the smallest package that fits, then add or remove features only where the business needs it.",d);
const s=aiOut.setup=pj(t);out("so1",`<div class=box><b>${esc(s.name)}</b> <span class=m>${esc(s.industry)}</span><p>Package: ${esc(s.pkg)}</p><p class=m>Add: ${esc((s.add||[]).join(", ")||"nothing")}<br>Remove: ${esc((s.remove||[]).join(", ")||"nothing")}</p><p class=m>${esc(s.notes||"")}</p><button class=btn id=ai4>Create this client</button></div>`)})}
function applySetup(){const s=aiOut.setup;if(!s)return;const id=P(s.pkg)?s.pkg:S.pkgs[0].id,pf=new Set(P(id).feat),ix=l=>(Array.isArray(l)?l:[]).map(n=>F.findIndex(f=>f.n.toLowerCase()==String(n).toLowerCase())).filter(i=>i>=0&&F[i].t>0);
S.clients.push({id:uid(),name:String(s.name||"New client"),owner:"",phone:"",city:"Faisalabad",industry:String(s.industry||""),pkg:id,expiry:"",ai:"",notes:String(s.notes||""),add:ix(s.add).filter(i=>!pf.has(i)),rem:ix(s.remove).filter(i=>pf.has(i))});save();tab="cl";render()}
function runList(){const d=g("sd2").trim();if(!d)return;return busy("so2",async()=>{const t=await callAI('You write short practical checklists for workers in Pakistani businesses. Answer with one JSON object only: {"name":string,"items":[strings]}. Use simple English, 6 to 12 items, one action each.',"Industry: "+tplInd+". Checklist for: "+d);const l=aiOut.list=pj(t);out("so2",`<div class=box><b>${esc(l.name)}</b>${(l.items||[]).map(x=>`<div>☐ ${esc(x)}</div>`).join("")}<div class=row style=margin-top:10px><button class=btn id=ai5>Save to ${esc(tplInd)} templates</button></div></div>`)})}
function saveList(){const l=aiOut.list;if(!l||!Array.isArray(l.items))return;((S.tpl=S.tpl||{})[tplInd]=S.tpl[tplInd]||{})[String(l.name||"AI checklist")]=l.items.map(String);save();tab="tp";render()}
function runAsk(){const d=g("sd3").trim();if(!d)return;return busy("so3",async()=>{const t=await callAI("You help a software seller in Faisalabad, Pakistan who sells a work-management app to factories, shops and other businesses. Answer in short, plain English and say so when you are unsure.",d);out("so3",`<div class=box style="white-space:pre-wrap">${esc(t)}</div>`)})}
document.addEventListener("click",e=>{const T=e.target,a=k=>T.closest("["+k+"]");let el;
if(el=a("data-cp")){const it=allTpl(tplInd)[el.dataset.cp];navigator.clipboard.writeText("## "+el.dataset.cp+"\n"+it.map(x=>"- [ ] "+x).join("\n")).then(()=>{el.textContent="Copied"},()=>alert("The browser blocked copying. Select the items and copy by hand."))}
else if(el=a("data-pr")){const it=allTpl(tplInd)[el.dataset.pr],w=window.open("","_blank");if(w){w.document.write("<title>"+esc(el.dataset.pr)+"</title><h2>"+esc(el.dataset.pr)+"</h2>"+it.map(x=>"<p>☐ "+esc(x)+"</p>").join(""));w.document.close();w.print()}}
else if(T.id=="ts"){const n=g("tn").trim(),it=g("tl").split("\n").map(x=>x.trim()).filter(Boolean);if(!n||!it.length)return alert("Add a name and at least one item.");((S.tpl=S.tpl||{})[tplInd]=S.tpl[tplInd]||{})[n]=it;save();render()}
else if(T.id=="ai1")runSetup();else if(T.id=="ai2")runList();else if(T.id=="ai3")runAsk();else if(T.id=="ai4")applySetup();else if(T.id=="ai5")saveList()});
document.addEventListener("change",e=>{const T=e.target,c=aiCfg();if(T.id=="ti"){tplInd=T.value;render()}else if(T.id=="cfgP"){c.p=T.value;c.base=PRE[T.value][0];c.model=PRE[T.value][1];save();render()}else if(T.id=="cfgU"){c.base=T.value.trim();save()}else if(T.id=="cfgM"){c.model=T.value.trim();save()}else if(T.id=="cfgK"){c.key=T.value.trim();save()}});
// ---- v1.6: signed client codes, hub settings
const FREEH=["Profit margin calculator","Discount calculator","Percentage change","Yards and metres","Kilograms and pounds","Inches and centimetres","Daily cash book","Checklists","Timer and stopwatch"];
function mig2(){if(S.v>=6)return;S.keys=S.keys||null;S.sc=S.sc||[];S.atm=S.atm||{brand:"SD Work Associates",color:"#35d05a",welcome:"Welcome. Free tools are open to everyone. Enter a code to unlock more.",banner:"",maint:false,maintMsg:"We are updating. Please come back soon.",wa:""};
const sp=S.pkgs.find(p=>p.id=="S");if(sp)byN(FREEH).forEach(i=>{if(!sp.feat.includes(i))sp.feat.push(i)});
S.pkgs.forEach(p=>{const lv={A:1,B:2,D:2,C:3}[p.id];if(lv)F.forEach((f,i)=>{if(i>=130&&f.t>0&&f.t<=lv&&!p.feat.includes(i))p.feat.push(i)});if(p.id=="D")byN(["Gemini AI assistant","NotebookLM and Gemini launcher"]).forEach(i=>{if(!p.feat.includes(i))p.feat.push(i)})});S.v=6}
const b64=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function codesBox(){const L=(S.sc||[]).slice(0,15);return `<div class=box><div class=row><h2>Client codes for the SD Work Hub</h2></div>${S.keys?"":'<p style="color:var(--w)">Create your signing keys first (Hub and atmosphere tab).</p>'}${S.clients.length?sel("gc","Client",S.clients.map(c=>[c.id,c.name+" (package "+c.pkg+")"]))+fld("gd","Days of access","30","number")+'<div class=row style=margin-top:10px><button class=btn id=gm>Make code</button></div>':'<p class=m>Add a client first.</p>'}<div id=go></div><p class=m>A code unlocks the features in the client's list at the moment you make it, so change their features first. A code cannot be cancelled early, so use shorter periods for new clients.</p>${L.length?`<div class=w><table><tr><th>Client</th><th>Until</th><th></th></tr>${L.map((x,i)=>`<tr><td>${esc(x.n)}</td><td>${x.e}</td><td><button class="btn s" data-cc="${i}">Copy code</button></td></tr>`).join("")}</table></div>`:""}</div>`}
async function makeCode(){const c=S.clients.find(x=>x.id==g("gc"));if(!c)return;if(!S.keys)return alert("Create your signing keys first.");
const d=Math.max(1,Math.min(3650,+g("gd")||30)),e=new Date(Date.now()+d*864e5).toISOString().slice(0,10),bits=new Uint8Array(Math.ceil(F.length/8));eff(c).forEach(i=>{if(F[i].t>0)bits[i>>3]|=1<<(i&7)});
const pl=new TextEncoder().encode(JSON.stringify({n:c.name,e,i:today(),b:b64(bits)})),k=await crypto.subtle.importKey("jwk",S.keys.priv,{name:"ECDSA",namedCurve:"P-256"},false,["sign"]),sg=new Uint8Array(await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},k,pl)),code="SD1-"+b64(pl)+"."+b64(sg);
c.expiry=e;(S.sc=S.sc||[]).unshift({n:c.name,e,code});save();
const ph=String(c.phone||"").replace(/\D/g,""),m="Your SD Work Hub code, valid until "+e+". Open the hub, paste this code and press Redeem:\n\n"+code;
render();out("go",`<div class=box><b>Code ready for ${esc(c.name)}</b><p class=code>${code}</p><div class=row><button class=btn data-cc="0">Copy code</button><a class="btn s" target=_blank rel=noopener href="https://wa.me/${ph}?text=${encodeURIComponent(m)}">Send on WhatsApp</a></div><p class=m>For WhatsApp to open the right chat, save the client's phone number with the country code (for example 923001234567).</p></div>`)}
function hubTab(){const a=S.atm,k=S.keys;return `<div class=row><h2>Hub and atmosphere</h2></div>
<div class=box><b>1. Signing keys</b><p class=m>Keys make your codes impossible to fake. Create them once. Making new keys later cancels every code you sent before.</p>${k?'<p style="color:var(--g)">Keys are ready.</p>':""}<button class=btn id=kg>${k?"Make new keys":"Create signing keys"}</button></div>
<div class=box><b>2. Atmosphere: what customers see in the hub</b><div class=two>${fld("atB","Brand name",a.brand)}${fld("atC","Accent colour",a.color,"color")}</div>${fld("atQ","Your WhatsApp number for code requests (with country code)",a.wa)}<label for=atP>How customers pay you (JazzCash, EasyPaisa or bank details)</label><textarea id=atP rows=3>${esc(a.pay||"")}</textarea>${fld("atW","Welcome message",a.welcome)}${fld("atN","Banner message (leave empty for none)",a.banner)}<label><input id=atM type=checkbox style=width:auto ${a.maint?"checked":""}> Maintenance mode: customers see only the message below</label>${fld("atR","Maintenance message",a.maintMsg)}</div>
<div class=box><b>3. Free tools for everyone</b><p class=m>Everyone gets the tools in your <b>Starter</b> package without a code. Change them in the Packages tab. Right now: ${esc(S.pkgs.find(p=>p.id=="S").feat.filter(i=>F[i].c=="Hub tools (v1.6)").map(i=>F[i].n).join(", ")||"none")}.</p></div>
<div class=box><b>4. Publish</b><p class=m>Download the file and upload it to GitHub in the folder <b>apps/web/public/hub</b>, replacing the old one. Customers see the new settings once the site rebuilds. Do this whenever you change atmosphere, keys or free tools. Codes already sent keep working.</p><button class=btn id=dlc>Download config.json</button></div>`}
const _pay=pay;V.pay=()=>codesBox()+_pay();V.hub=hubTab;
document.addEventListener("click",async e=>{const T=e.target,el=T.closest("[data-cc]");
if(T.id=="kg"){if(S.keys&&!confirm("New keys cancel every code you made before. Continue?"))return;const k=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);S.keys={pub:await crypto.subtle.exportKey("jwk",k.publicKey),priv:await crypto.subtle.exportKey("jwk",k.privateKey)};save();render()}
else if(T.id=="gm")makeCode();
else if(el){const x=(S.sc||[])[+el.dataset.cc];if(x)navigator.clipboard.writeText(x.code).then(()=>{el.textContent="Copied"},()=>alert("Copying was blocked. Select the code and copy it by hand."))}
else if(T.id=="dlc"){if(!S.keys)return alert("Create your signing keys first.");const cfg={v:1,catalog:F.map(f=>f.n),starter:S.pkgs.find(p=>p.id=="S").feat.map(i=>F[i].n),pub:S.keys.pub,atm:S.atm,pkgs:S.pkgs.map(p=>({id:p.id,name:p.name,price:p.price,n:p.feat.length}))};const l=document.createElement("a");l.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(cfg));l.download="config.json";l.click()}});
document.addEventListener("change",e=>{const T=e.target,m={atB:"brand",atC:"color",atW:"welcome",atN:"banner",atR:"maintMsg",atQ:"wa",atP:"pay"};if(m[T.id]){S.atm[m[T.id]]=T.value;save()}else if(T.id=="atM"){S.atm.maint=T.checked;save()}});
function mig3(){if(S.v>=7)return;S.atm=S.atm||{};if(S.atm.pay==null)S.atm.pay="";const sp=S.pkgs.find(p=>p.id=="S");if(sp)byN(["Mood check-in","Daily motivation"]).forEach(i=>{if(!sp.feat.includes(i))sp.feat.push(i)});S.pkgs.forEach(p=>{const lv={A:1,B:2,D:2,C:3}[p.id];if(lv)F.forEach((f,i)=>{if(i>=185&&f.t>0&&f.t<=lv&&!p.feat.includes(i))p.feat.push(i)})});S.v=7}
render();
